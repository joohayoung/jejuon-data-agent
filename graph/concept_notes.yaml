# 개념(측정값) → 화면 결론 아래에 붙일 해설.
# when_words는 질문 해석에 쓰지 않는다(해석은 모델만). 해설 문장을 고를 때만 쓴다:
# 질문에 이 말이 있으면 앞에 "'관광객'은 방문지표로 계산했습니다." 를 붙인다.
방문인구:
  label: 방문지표
  note: "방문지표는 그 읍면동에 머문 '방문' 인구를 허브가 가공한 지수입니다. 관광객만 따로 센 값이 아니며(다른 동네에서 온 도민 포함), 사람 수(명)도 아닙니다."
  when_words: [관광객, 여행객, 손님, 사람, 유동인구]
외국인방문인구:
  label: 외국인 방문지표
  note: "외국인 단기체류 방문지표(허브 가공 지수)입니다. 장기체류 외국인은 포함하지 않습니다."
  when_words: [외국인 관광객, 중국인, 외국 손님]
거주인구:
  label: 거주지표
  note: "거주지표(추정치)입니다. 주민등록 인구가 아닙니다."
  when_words: [주민, 사는 사람, 인구]
근무인구:
  label: 근무지표
  note: "근무지표(허브 가공 지수)입니다. 사업체 종사자 수가 아닙니다."
  when_words: [직장인, 회사원]
카드이용금액:
  label: 카드이용금액
  note: "제공 카드사 이용분의 합계로, 가게 전체 매출이 아닙니다."
  when_words: [매출, 수입, 벌어, 장사]
점포수:
  label: 점포 수
  note: "상가(상권) 정보에 등록된 점포 수로, 실제 영업 여부는 포함하지 않습니다."
