숙박:
  # 카드에는 호텔업·여관업·휴양콘도 운영업 3개, 펜션에 맞는 카드 업종은 없음 → 숙박 전체 하나로 맞춤.
  # 카드 지표(I4·I7)는 펜션을 따로 반영하지 못한다는 한계를 리포트에 적는다.
  aliases: [숙박, 숙박업, 숙박시설, 숙소, 펜션, 민박, 독채, 스테이, 게스트하우스, 게하, 호텔, 모텔, 여관, 리조트, 글램핑, 캠핑장]
  note: "숙박은 상가정보 일반 숙박 4개(펜션·여관/모텔·호텔/리조트·캠핑/글램핑)와 카드 호텔업·여관업·휴양콘도 운영업으로 분석했다. 카드 데이터에는 펜션 업종이 없어 카드 지표(관광객 의존도·점포당 카드 매출)에 펜션이 따로 반영되지 않는다."
  store:
    # 상권업종중분류명 "일반 숙박" 아래 4개, 7,280점포(2025-09-18 기준).
    # "기타 숙박"(기숙사/고시원 5, 그 외 기타 숙박업 16)은 관광 숙박으로 보기 어려워 넣지 않음
    소분류: ["펜션", "여관/모텔", "호텔/리조트", "캠핑/글램핑"]
  card_emd:
    업종명: ["호텔업", "여관업", "휴양콘도 운영업"]   # I55111·I55112·I55113
  card_jeju:
    biz_nm: ["호텔업", "여관업", "휴양콘도 운영업"]
  menu_sales:
    menu_name: []
  restaurant:
    업종구분소분류: []   # 음식점 목록에는 숙박업이 없음 → I9·I10 확인 불가

